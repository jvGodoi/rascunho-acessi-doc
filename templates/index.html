<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <title>AcessiDoc</title>
</head>

<body>
  <header>
    <div class="cabecalho">
      <div class="marca">
        <a href="/">
          <h1>Acessi<span>Doc.</span></h1>
        </a>
      </div>
      <!--
      <a href="#" class="conta">
        <img src="{{ url_for('static', filename='icones/conta.svg') }}" alt="Ícone da conta" />
        Minha Conta
      </a>
      -->
    </div>
  </header>

  <main>
    <!--     <img src="{{ url_for('static', filename='icones/acessi.svg') }}" alt="acessibilidade" class="icone-acessibilidade" />
 -->
    <section class="container-upload">
      <div class="bloco-arquivo">
        <input type="file" id="entrada-arquivo" class="entrada-arquivo" accept=".pdf, .docx, .txt" />
        <label for="entrada-arquivo" class="caixa-upload" id="zona-soltar">
          <img src="{{ url_for('static', filename='img/upload.png') }}" alt="Upload" class="icone-upload" />
          <p>Arraste e solte o arquivo<br />ou Clique para selecionar</p>
        </label>
      </div>

      <h4 class="info-idioma">O idioma será detectado automaticamente</h4>
      <div class="bloco-anexo" id="info-anexo">
        <h4>Nenhum Arquivo Selecionado</h4>
      </div>

      <div class="bloco-voz">
        <fieldset class="voz-genero">
          <div class="voz-genero-conteudo">
            <legend class="voz-genero-titulo">Converter na voz:</legend>
          </div>

          <div class="voz-genero-opcoes">
            <input type="radio" id="voz-feminina" name="preferred_gender" value="Female" checked />
            <label class="voz-genero-rotulo" for="voz-feminina">Feminina</label>

            <input type="radio" id="voz-masculina" name="preferred_gender" value="Male" />
            <label class="voz-genero-rotulo" for="voz-masculina">Masculina</label>
          </div>
        </fieldset>
      </div>

      <div class="bloco-converter">
        <button type="button" class="botao botao-converter">
          Converter
        </button>
        <div id="status-conversao" class="mensagem-status" aria-live="polite"></div>
      </div>
    </section>

    <section id="secao-player" style="display: none;" class="tocador-audio">
      <p class="rotulo-audio">Ouça abaixo o áudio convertido.</p>

      <div class="caixa-audio">
        <div class="info-audio">
          <img src="{{ url_for('static', filename='icones/audio.svg') }}" alt="Ícone de áudio" class="icone-audio" />
          <div>
            <h4 class="titulo-audio" id="nome-audio">Nome do Arquivo</h4>
            <div class="meta-audio" id="meta-audio">
              <span>Voz</span>
              <span class="separador"></span>
              <span>Idioma</span>
            </div>
          </div>
        </div>

        <audio id="elemento-audio">
          <source id="fonte-audio" src="" type="audio/mp3" />
          Seu navegador não suporta o elemento de áudio.
        </audio>

        <div class="controle-tempo">
          <span id="tempo-inicial">00:00</span>
          <input type="range" id="barra-progresso" value="0" step="any" />
          <span id="tempo-final">00:00</span>
        </div>

        <div class="botoes-audio">
          <button id="botao-repetir" class="botao botao-repetir">
            <img src="{{ url_for('static', filename='icones/repetir.svg') }}" alt="Repetir" />
            Repetir
          </button>

          <button id="botao-ouvir" class="botao botao-ouvir">
            <img src="{{ url_for('static', filename='icones/fone.svg') }}" alt="Ouvir" />
            Ouvir
          </button>

          <div class="controle-volume">
            <img id="icone-volume" src="{{ url_for('static', filename='icones/volume.svg') }}" alt="Volume" style="cursor: pointer;" />
            <input type="range" id="volume" min="0" max="1" step="0.1" value="1" />
          </div>
        </div>
      </div>

      <p class="rotulo-download">Baixe-o para ouvir em qualquer lugar.</p>
      <a id="link-download" href="#" download class="botao botao-download" data-convertido="false">
        <img src="{{ url_for('static', filename='icones/download.svg') }}" alt="Baixar" />
        Baixar Áudio
      </a>
    </section>

    <div id="sobreposicao-conversao" style="display: none;">
      <div class="caixa-modal">
        <p>
          <img src="{{ url_for('static', filename='icones/tempo.svg') }}" alt="Tempo" />
          O arquivo está sendo convertido...
        </p>
      </div>
    </div>
  </main>

  <!--
  <footer class="rodape">
    João Vitor dos Anjos Godoi - 2025
  </footer>
  -->

  <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
